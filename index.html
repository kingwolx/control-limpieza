<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<meta
  name="theme-color"
  content="#f4f6f8">

<meta
  name="apple-mobile-web-app-capable"
  content="yes">

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="default">

<link
  rel="manifest"
  href="/manifest.webmanifest">

<title>Control de Limpieza</title>


<style>

/* =====================================================
   BASE
   ===================================================== */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {

  margin: 0;
  padding: 0;

  width: 100%;
  min-height: 100%;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background: #f4f6f8;

  color: #222;

}

body {
  min-height: 100dvh;
}


.app {

  width: 100%;

  min-height: 100dvh;

  display: flex;

  justify-content: center;

  padding:
    max(20px, env(safe-area-inset-top))
    max(16px, env(safe-area-inset-right))
    max(20px, env(safe-area-inset-bottom))
    max(16px, env(safe-area-inset-left));

}


.contenido {

  width: 100%;

  max-width: 620px;

}


/* =====================================================
   ENCABEZADO
   ===================================================== */

.encabezado {

  text-align: center;

  padding:
    18px 0 22px;

}


.logo {

  width: 72px;
  height: 72px;

  margin:
    0 auto 15px;

  border-radius: 22px;

  background: white;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 38px;

  box-shadow:
    0 8px 25px rgba(0,0,0,.08);

}


.titulo {

  margin: 0;

  font-size:
    clamp(25px, 7vw, 36px);

  font-weight: 800;

  letter-spacing: -.5px;

}


.subtitulo {

  margin-top: 7px;

  font-size:
    clamp(15px, 4vw, 19px);

  color: #777;

}


/* =====================================================
   CONEXIÓN
   ===================================================== */

.estadoConexion {

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 8px;

  width: fit-content;

  margin:
    0 auto 18px;

  padding:
    8px 14px;

  border-radius: 999px;

  font-size:
    clamp(13px, 3.5vw, 16px);

  font-weight: 700;

  transition:
    all .2s ease;

}


.estadoConexion.online {

  background: #e5f7eb;

  color: #20733f;

}


.estadoConexion.offline {

  background: #fdeaea;

  color: #b52d2d;

}


.estadoConexion.pendiente {

  background: #fff4d8;

  color: #9a6b00;

}


/* =====================================================
   TARJETA
   ===================================================== */

.tarjeta {

  width: 100%;

  background: white;

  border-radius: 28px;

  padding:
    clamp(24px, 6vw, 38px);

  box-shadow:
    0 12px 40px rgba(0,0,0,.08);

}


/* =====================================================
   LOGIN
   ===================================================== */

.login-titulo {

  text-align: center;

  font-size:
    clamp(22px, 6vw, 30px);

  font-weight: 700;

  margin-bottom: 25px;

}


label {

  display: block;

  font-size:
    clamp(17px, 4.5vw, 20px);

  font-weight: 700;

  margin-bottom: 10px;

}


input,
select {

  width: 100%;

  height:
    clamp(62px, 15vw, 76px);

  border:
    2px solid #e1e4e8;

  border-radius: 17px;

  background: #fafbfc;

  padding:
    0 18px;

  font-size:
    clamp(18px, 5vw, 22px);

  outline: none;

  margin-bottom: 20px;

  color: #222;

}


input:focus,
select:focus {

  border-color: #444;

  background: white;

}


/* =====================================================
   BOTONES
   ===================================================== */

button {

  width: 100%;

  min-height:
    clamp(70px, 17vw, 88px);

  border: 0;

  border-radius: 19px;

  font-size:
    clamp(19px, 5vw, 24px);

  font-weight: 800;

  letter-spacing: .2px;

  cursor: pointer;

  margin-top: 12px;

  transition:
    transform .08s ease,
    opacity .2s ease;

}


button:active {

  transform:
    scale(.98);

}


button:disabled {

  opacity: .45;

  cursor:
    not-allowed;

}


/* =====================================================
   BOTÓN CONTINUAR
   ===================================================== */

.btn-continuar {

  background:
    #252525;

  color:
    white;

}


/* =====================================================
   BOTÓN ENTRADA
   ===================================================== */

.btn-entrada {

  background:
    #27ae60;

  color:
    white;

  box-shadow:
    0 8px 20px
    rgba(39,174,96,.25);

}


/* =====================================================
   BOTÓN SALIDA
   ===================================================== */

.btn-salida {

  background:
    #d94b4b;

  color:
    white;

  box-shadow:
    0 8px 20px
    rgba(217,75,75,.22);

}


/* =====================================================
   BIENVENIDA
   ===================================================== */

.bienvenida {

  text-align:
    center;

  margin-bottom:
    28px;

}


.hola {

  font-size:
    clamp(22px, 6vw, 30px);

  font-weight:
    700;

  line-height:
    1.2;

}


.nombre {

  font-size:
    clamp(30px, 8vw, 42px);

  font-weight:
    800;

  margin-top:
    5px;

}


.email {

  margin-top:
    8px;

  color:
    #888;

  font-size:
    clamp(13px, 3.5vw, 16px);

  word-break:
    break-word;

}


/* =====================================================
   ESTADO TRABAJO
   ===================================================== */

.estado {

  margin-top:
    25px;

  padding:
    clamp(20px, 5vw, 28px);

  border-radius:
    20px;

  text-align:
    center;

  font-size:
    clamp(17px, 4.5vw, 21px);

  line-height:
    1.65;

}


.estado-libre {

  background:
    #f0f2f4;

  color:
    #666;

}


.estado-trabajando {

  background:
    #e5f7eb;

  color:
    #20733f;

}


.estado-offline {

  background:
    #fff4d8;

  color:
    #8b6500;

}


.estado-titulo {

  font-size:
    clamp(20px, 5vw, 25px);

  font-weight:
    800;

}


/* =====================================================
   MENSAJES
   ===================================================== */

.mensaje {

  min-height:
    28px;

  text-align:
    center;

  margin-top:
    18px;

  font-size:
    clamp(16px, 4vw, 19px);

  font-weight:
    700;

  line-height:
    1.4;

}


.mensaje-error {

  color:
    #c62828;

}


.mensaje-ok {

  color:
    #237642;

}


.mensaje-cargando {

  color:
    #777;

}


.mensaje-offline {

  color:
    #9a6b00;

}


/* =====================================================
   PENDIENTES
   ===================================================== */

.sincronizacion {

  display:
    none;

  margin-top:
    16px;

  padding:
    14px 16px;

  border-radius:
    15px;

  background:
    #fff4d8;

  color:
    #806000;

  text-align:
    center;

  font-size:
    15px;

  font-weight:
    700;

  line-height:
    1.4;

}


.sincronizacion.visible {

  display:
    block;

}


/* =====================================================
   SEPARADOR
   ===================================================== */

.separador {

  height:
    1px;

  background:
    #ececec;

  margin:
    28px 0 20px;

}


/* =====================================================
   CAMBIAR USUARIO
   ===================================================== */

.btn-cambiar {

  min-height:
    58px;

  background:
    #f0f1f3;

  color:
    #444;

  font-size:
    clamp(16px, 4vw, 19px);

  box-shadow:
    none;

}


/* =====================================================
   OCULTO
   ===================================================== */

.oculto {

  display:
    none !important;

}


/* =====================================================
   GRANDES
   ===================================================== */

@media (min-width: 700px) {

  .app {

    align-items:
      center;

  }

}


/* =====================================================
   CELULAR
   ===================================================== */

@media (max-width: 500px) {

  .app {

    padding:
      max(14px, env(safe-area-inset-top))
      14px
      max(14px, env(safe-area-inset-bottom))
      14px;

  }


  .encabezado {

    padding-top:
      8px;

  }


  .logo {

    width:
      64px;

    height:
      64px;

    font-size:
      34px;

  }


  .tarjeta {

    border-radius:
      24px;

  }

}


/* =====================================================
   CELULAR ALTO
   ===================================================== */

@media (
  max-width: 500px
) and (
  min-height: 750px
) {

  .app {

    align-items:
      flex-start;

  }


  .encabezado {

    padding-top:
      12px;

    padding-bottom:
      18px;

  }


  .tarjeta {

    padding:
      28px 22px;

  }

}


/* =====================================================
   HORIZONTAL
   ===================================================== */

@media (
  orientation: landscape
) and (
  max-height: 600px
) {

  .app {

    padding:
      14px;

  }


  .encabezado {

    padding:
      5px 0 10px;

  }


  .logo {

    display:
      none;

  }


  .tarjeta {

    padding:
      20px;

  }


  input,
  select {

    height:
      58px;

  }


  button {

    min-height:
      62px;

  }

}

</style>

</head>


<body>


<div class="app">

<div class="contenido">


<!-- ==================================================
     ENCABEZADO
     ================================================== -->

<div class="encabezado">

  <div class="logo">
    🧹
  </div>

  <h1 class="titulo">
    CONTROL DE LIMPIEZA
  </h1>

  <div class="subtitulo">
    Registro de entrada y salida
  </div>

</div>


<!-- ==================================================
     ESTADO INTERNET
     ================================================== -->

<div
  id="estadoConexion"
  class="estadoConexion online">

  🟢 CONECTADO

</div>


<!-- ==================================================
     LOGIN
     ================================================== -->

<div
  id="pantallaLogin"
  class="tarjeta">


  <div class="login-titulo">
    Ingresá a tu aplicación
  </div>


  <label>
    Email
  </label>


  <input
    id="email"
    type="email"
    placeholder="Ingresá tu email"
    autocomplete="email">


  <button
    id="btnContinuar"
    class="btn-continuar"
    onclick="ingresar()">

    CONTINUAR

  </button>


  <div
    id="mensajeLogin"
    class="mensaje">
  </div>


</div>



<!-- ==================================================
     APLICACIÓN
     ================================================== -->

<div
  id="pantallaApp"
  class="tarjeta oculto">


  <div class="bienvenida">

    <div class="hola">
      👋 HOLA
    </div>

    <div
      id="nombreUsuario"
      class="nombre">
    </div>

    <div
      id="emailUsuario"
      class="email">
    </div>

  </div>


  <!-- CLIENTE -->

  <label>
    Cliente
  </label>


  <select
    id="cliente">

    <option value="">
      Seleccionar cliente
    </option>

  </select>


  <!-- ENTRADA -->

  <button
    id="btnEntrada"
    class="btn-entrada"
    onclick="registrarEntrada()">

    🟢 REGISTRAR ENTRADA

  </button>


  <!-- SALIDA -->

  <button
    id="btnSalida"
    class="btn-salida"
    onclick="registrarSalida()">

    🔴 REGISTRAR SALIDA

  </button>


  <!-- ESTADO -->

  <div
    id="estado"
    class="estado estado-libre">

    ⚪
    <span class="estado-titulo">
      NO ESTÁS TRABAJANDO
    </span>

  </div>


  <!-- MENSAJE -->

  <div
    id="mensajeApp"
    class="mensaje">
  </div>


  <!-- SINCRONIZACIÓN -->

  <div
    id="sincronizacion"
    class="sincronizacion">
  </div>


  <div class="separador"></div>


  <!-- CAMBIAR USUARIO -->

  <button
    class="btn-cambiar"
    onclick="cambiarUsuario()">

    ⚙️ CAMBIAR USUARIO

  </button>


</div>


</div>

</div>



<script>

/* =====================================================
   CONFIGURACIÓN
   ===================================================== */

const API =
  '/api';


const STORAGE_EMAIL =
  'controlLimpiezaEmail';


const STORAGE_NOMBRE =
  'controlLimpiezaNombre';


/*
 * Los clientes ahora se guardan
 * asociados al email del usuario.
 */

const STORAGE_CLIENTES =
  'controlLimpiezaClientes_';


/*
 * Cola general de operaciones.
 */

const STORAGE_COLA =
  'controlLimpiezaColaOffline';


/*
 * Estado local de trabajo.
 *
 * Permite saber offline si ya
 * existe una entrada pendiente.
 */

const STORAGE_TRABAJO =
  'controlLimpiezaTrabajoOffline_';


let emailActual = '';

let nombreActual = '';

let clientesActuales = [];


/*
 * Evita ejecutar dos sincronizaciones
 * al mismo tiempo.
 */

let sincronizando = false;


/* =====================================================
   CLAVES LOCALES
   ===================================================== */

function claveClientes(
  email
) {

  return STORAGE_CLIENTES +
    String(email || '')
      .trim()
      .toLowerCase();

}


function claveTrabajo(
  email
) {

  return STORAGE_TRABAJO +
    String(email || '')
      .trim()
      .toLowerCase();

}


/* =====================================================
   INICIO
   ===================================================== */

window.addEventListener(
  'load',
  iniciar
);


/* =====================================================
   DETECTAR INTERNET
   ===================================================== */

window.addEventListener(
  'online',
  async function() {

    actualizarIndicadorConexion();

    mostrarMensajeApp(
      '✓ Volvió la conexión.',
      false
    );

    await sincronizarPendientes();

    if (
      emailActual
    ) {

      await cargarClientes();

      await actualizarEstado();

    }

  }
);


window.addEventListener(
  'offline',
  function() {

    actualizarIndicadorConexion();

    cargarClientesLocales();

    actualizarEstadoOffline();

    mostrarMensajeApp(
      'Sin conexión. La aplicación seguirá funcionando.',
      false,
      false,
      true
    );

  }
);


/* =====================================================
   INICIO
   ===================================================== */

async function iniciar() {

  actualizarIndicadorConexion();

  registrarServiceWorker();


  const email =
    localStorage.getItem(
      STORAGE_EMAIL
    );


  const nombre =
    localStorage.getItem(
      STORAGE_NOMBRE
    );


  if (
    email &&
    nombre
  ) {

    emailActual =
      email;

    nombreActual =
      nombre;


    /*
     * Primero cargamos SIEMPRE
     * los clientes locales.
     */

    cargarClientesLocales();


    mostrarAplicacion(
      email,
      nombre
    );


    /*
     * Si existe trabajo offline,
     * lo mostramos inmediatamente.
     */

    if (
      obtenerTrabajoOffline()
    ) {

      mostrarEstadoTrabajoOffline();

    }


    if (
      navigator.onLine
    ) {

      await cargarClientes();

      await actualizarEstado();

      await sincronizarPendientes();

    }

    else {

      actualizarEstadoOffline();

    }


    actualizarIndicadorPendientes();

  }

}


/* =====================================================
   SERVICE WORKER
   ===================================================== */

function registrarServiceWorker() {

  if (
    'serviceWorker' in navigator
  ) {

    navigator.serviceWorker
      .register('/sw.js')
      .then(
        function() {

          console.log(
            'Service Worker registrado.'
          );

        }
      )
      .catch(
        function(error) {

          console.log(
            'No se pudo registrar Service Worker:',
            error
          );

        }
      );

  }

}


/* =====================================================
   INDICADOR INTERNET
   ===================================================== */

function actualizarIndicadorConexion() {

  const indicador =
    document.getElementById(
      'estadoConexion'
    );


  if (!indicador) {
    return;
  }


  if (
    navigator.onLine
  ) {

    indicador.className =
      'estadoConexion online';


    indicador.innerText =
      '🟢 CONECTADO';

  }

  else {

    indicador.className =
      'estadoConexion offline';


    indicador.innerText =
      '🔴 SIN CONEXIÓN';

  }

}


/* =====================================================
   PETICIÓN API
   ===================================================== */

async function llamarAPI(
  accion,
  datos = {}
) {

  if (
    !navigator.onLine
  ) {

    throw new Error(
      'SIN_CONEXION'
    );

  }


  const respuesta =
    await fetch(
      API,
      {

        method:
          'POST',

        headers: {

          'Content-Type':
            'application/json'

        },

        body:
          JSON.stringify({

            accion:
              accion,

            ...datos

          })

      }
    );


  const resultado =
    await respuesta.json();


  return resultado;

}


/* =====================================================
   INGRESAR
   ===================================================== */

async function ingresar() {

  const input =
    document.getElementById(
      'email'
    );


  const email =
    input.value
      .trim()
      .toLowerCase();


  if (!email) {

    mostrarMensajeLogin(
      'Ingresá tu email.',
      true
    );

    return;

  }


  /*
   * =================================================
   * OFFLINE
   * =================================================
   */

  if (
    !navigator.onLine
  ) {

    const emailGuardado =
      localStorage.getItem(
        STORAGE_EMAIL
      );


    const nombreGuardado =
      localStorage.getItem(
        STORAGE_NOMBRE
      );


    /*
     * Por seguridad solamente
     * permitimos entrar offline
     * con el usuario que ya fue
     * validado anteriormente
     * en ESTE teléfono.
     */

    if (
      emailGuardado === email &&
      nombreGuardado
    ) {

      emailActual =
        emailGuardado;

      nombreActual =
        nombreGuardado;


      cargarClientesLocales();


      mostrarAplicacion(
        emailActual,
        nombreActual
      );


      if (
        obtenerTrabajoOffline()
      ) {

        mostrarEstadoTrabajoOffline();

      }

      else {

        actualizarEstadoOffline();

      }


      return;

    }


    mostrarMensajeLogin(
      'Sin conexión. Este teléfono debe haber ingresado previamente con este usuario.',
      true
    );


    return;

  }


  /*
   * =================================================
   * ONLINE
   * =================================================
   */

  const boton =
    document.getElementById(
      'btnContinuar'
    );


  boton.disabled =
    true;


  mostrarMensajeLogin(
    'Verificando...',
    false,
    true
  );


  try {

    const resultado =
      await llamarAPI(
        'verificarUsuario',
        {
          email:
            email
        }
      );


    if (!resultado.ok) {

      mostrarMensajeLogin(
        resultado.mensaje,
        true
      );


      boton.disabled =
        false;


      return;

    }


    localStorage.setItem(
      STORAGE_EMAIL,
      resultado.email
    );


    localStorage.setItem(
      STORAGE_NOMBRE,
      resultado.nombre
    );


    emailActual =
      resultado.email;


    nombreActual =
      resultado.nombre;


    mostrarAplicacion(
      resultado.email,
      resultado.nombre
    );


    await cargarClientes();

    await actualizarEstado();


  }

  catch (error) {

    mostrarMensajeLogin(
      'Error de conexión: ' +
      error.message,
      true
    );

  }


  boton.disabled =
    false;

}


/* =====================================================
   MOSTRAR APLICACIÓN
   ===================================================== */

function mostrarAplicacion(
  email,
  nombre
) {

  document
    .getElementById(
      'pantallaLogin'
    )
    .classList
    .add('oculto');


  document
    .getElementById(
      'pantallaApp'
    )
    .classList
    .remove('oculto');


  document
    .getElementById(
      'nombreUsuario'
    )
    .innerText =
      nombre;


  document
    .getElementById(
      'emailUsuario'
    )
    .innerText =
      email;


  actualizarIndicadorConexion();

}


/* =====================================================
   CLIENTES
   ===================================================== */

async function cargarClientes() {

  /*
   * Primero cargamos los clientes
   * locales. Esto evita que el
   * selector quede vacío mientras
   * esperamos al servidor.
   */

  cargarClientesLocales();


  if (
    !navigator.onLine
  ) {

    return;

  }


  mostrarMensajeApp(
    'Actualizando clientes...',
    false,
    true
  );


  try {

    const resultado =
      await llamarAPI(
        'obtenerClientes',
        {
          email:
            emailActual
        }
      );


    if (!resultado.ok) {

      /*
       * Conservamos los clientes
       * locales si la API falla.
       */

      cargarClientesLocales();


      mostrarMensajeApp(
        resultado.mensaje,
        true
      );


      return;

    }


    clientesActuales =
      resultado.clientes || [];


    /*
     * GUARDAR CLIENTES
     * POR USUARIO.
     */

    localStorage.setItem(
      claveClientes(emailActual),
      JSON.stringify(
        clientesActuales
      )
    );


    mostrarClientesEnSelect(
      clientesActuales
    );


    if (
      clientesActuales.length === 0
    ) {

      mostrarMensajeApp(
        'No hay clientes asignados.',
        true
      );


      return;

    }


    mostrarMensajeApp(
      '',
      false
    );


    actualizarIndicadorPendientes();

  }

  catch (error) {

    cargarClientesLocales();


    if (
      error.message ===
      'SIN_CONEXION'
    ) {

      mostrarMensajeApp(
        'Sin conexión. Usando clientes guardados.',
        false,
        false,
        true
      );

    }

    else {

      mostrarMensajeApp(
        'Error al actualizar clientes: ' +
        error.message,
        true
      );

    }

  }

}


/* =====================================================
   CLIENTES LOCALES
   ===================================================== */

function cargarClientesLocales() {

  if (
    !emailActual
  ) {

    return;

  }


  try {

    const datos =
      localStorage.getItem(
        claveClientes(emailActual)
      );


    if (!datos) {

      console.log(
        'No hay clientes locales para:',
        emailActual
      );

      return;

    }


    const clientes =
      JSON.parse(datos);


    if (
      !Array.isArray(clientes)
    ) {

      return;

    }


    clientesActuales =
      clientes;


    mostrarClientesEnSelect(
      clientes
    );


    console.log(
      'Clientes locales cargados:',
      clientes.length
    );

  }

  catch (error) {

    console.log(
      'Error leyendo clientes locales:',
      error
    );

  }

}


/* =====================================================
   MOSTRAR CLIENTES
   ===================================================== */

function mostrarClientesEnSelect(
  clientes
) {

  const select =
    document.getElementById(
      'cliente'
    );


  if (!select) {
    return;
  }


  const valorAnterior =
    select.value;


  select.innerHTML =
    '';


  const primera =
    document.createElement(
      'option'
    );


  primera.value =
    '';


  primera.textContent =
    'Seleccionar cliente';


  select.appendChild(
    primera
  );


  clientes.forEach(
    function(nombreCliente) {

      const opcion =
        document.createElement(
          'option'
        );


      opcion.value =
        nombreCliente;


      opcion.textContent =
        nombreCliente;


      select.appendChild(
        opcion
      );

    }
  );


  /*
   * Si el cliente anterior
   * sigue existiendo, lo dejamos
   * seleccionado.
   */

  if (
    valorAnterior &&
    clientes.includes(
      valorAnterior
    )
  ) {

    select.value =
      valorAnterior;

  }

}

  const trabajoOffline =
    obtenerTrabajoOffline();


  if (

    mostrarEstadoTrabajoOffline();

  }


  if (
    !navigator.onLine
  ) {

    actualizarEstadoOffline();

    return;

  }


  try {

    const resultado =
      await llamarAPI(
        'obtenerEstado',

        }
      );

      mostrarMensajeApp(
        resultado.mensaje,
        true
      );


      return;

    }


    mostrarEstadoServidor(
      resultado
    );

  }

  catch (error) {

    actualizarEstadoOffline();

  }

}

function obtenerTrabajoOffline() {

  if (
    !emailActual
  ) {

  }


  try {

    const datos =
      localStorage.getItem(
        claveTrabajo(emailActual)
      );


    if (!datos) {

      return null;

    }


    const trabajo =
      JSON.parse(datos);


    if (
      !trabajo ||
      !trabajo.cliente ||
      !trabajo.timestamp
    ) {

      return null;

    }


    return trabajo;

  }

  catch (error) {

    return null;

  }

}

   GUARDAR TRABAJO OFFLINE
   ===================================================== */

function guardarTrabajoOffline(
  trabajo
) {

  localStorage.setItem(

    claveTrabajo(

    JSON.stringify(
      trabajo
    )

  );

   ===================================================== */

}


/* =====================================================
   ENTRADA
   ===================================================== */

async function registrarEntrada() {

  const select =
    document.getElementById(
      'cliente'
    );


  const cliente =
    select.value;


  if (!cliente) {

    mostrarMensajeApp(
      'Seleccioná un cliente.',
      true
    );


    return;

  }


  /*
   * No permitir una segunda
   * entrada si existe una entrada
   * offline pendiente.
   */

  if (
    obtenerTrabajoOffline()
  ) {

    mostrarMensajeApp(
      'Ya tenés una entrada pendiente de sincronización.',
      true
    );


    mostrarEstadoTrabajoOffline();


    return;

  }


  const boton =
    document.getElementById(
      'btnEntrada'
    );


  boton.disabled =
    true;


  /*
   * =================================================
   * SIN INTERNET
   * =================================================
   */

  if (
    !navigator.onLine
  ) {

    const ahora =
      Date.now();


    /*
     * Guardamos el estado de trabajo.
     */

    guardarTrabajoOffline({

      email:
        emailActual,

      cliente:
        cliente,

      timestamp:
        ahora

    });


    /*
     * Guardamos la operación
     * en la cola.
     */

    agregarOperacionOffline({

      tipo:
        'entrada',

      email:
        emailActual,

      cliente:
        cliente,

      timestamp:
        ahora

    });


    mostrarMensajeApp(
      '✓ Entrada guardada. Se sincronizará cuando vuelva Internet.',
      false
    );


    mostrarEstadoTrabajoOffline();


    actualizarIndicadorPendientes();


    return;

  }


  /*
   * =================================================
   * CON INTERNET
   * =================================================
   */

  mostrarMensajeApp(
    'Registrando entrada...',
    false,
    true
  );


  try {

    const resultado =
      await llamarAPI(
        'registrarEntrada',
        {

          email:
            emailActual,

          cliente:
            cliente

        }
      );


    if (!resultado.ok) {

      mostrarMensajeApp(
        resultado.mensaje,
        true
      );


      boton.disabled =
        false;


      await actualizarEstado();


      return;

    }


    mostrarMensajeApp(
      '✓ Entrada registrada correctamente.',
      false
    );


    await actualizarEstado();

  }

  catch (error) {

    /*
     * La conexión puede haberse
     * perdido justo durante el fetch.
     */

    if (
      error.message ===
      'SIN_CONEXION'
    ) {

      const ahora =
        Date.now();


      guardarTrabajoOffline({

        email:
          emailActual,

        cliente:
          cliente,

        timestamp:
          ahora

      });


      agregarOperacionOffline({

        tipo:
          'entrada',

        email:
          emailActual,

        cliente:
          cliente,

        timestamp:
          ahora

      });


      mostrarMensajeApp(
        '✓ Entrada guardada. Se sincronizará cuando vuelva Internet.',
        false
      );


      mostrarEstadoTrabajoOffline();


      actualizarIndicadorPendientes();

    }

    else {

      mostrarMensajeApp(
        'ERROR: ' +
        error.message,
        true
      );


      boton.disabled =
        false;

    }

  }

}

   ===================================================== */

async function registrarSalida() {

  if (
    !confirm(
      '¿Confirmás que querés registrar la salida?'
    )
  ) {

    return;

  }


  const boton =
    document.getElementById(
      'btnSalida'
    );


  boton.disabled =
    true;


  /*
   * =================================================
   * SIN INTERNET
   * =================================================
   */

  if (
    !navigator.onLine
  ) {

    const trabajo =
      obtenerTrabajoOffline();


    if (
      !trabajo
    ) {

      mostrarMensajeApp(
        'No hay una entrada pendiente para registrar la salida.',
        true
      );


      boton.disabled =
        false;


      return;

    }


    const ahora =
      Date.now();


    /*
     * Guardamos la salida en la cola.
     */

    agregarOperacionOffline({

      tipo:
        'salida',

      email:
        emailActual,

      timestamp:
        ahora

    });


    /*
     * La entrada y salida
     * forman una operación completa.
     */

    borrarTrabajoOffline();


    mostrarMensajeApp(
      '✓ Salida guardada. Se sincronizará cuando vuelva Internet.',
      false
    );


    const estado =
      document.getElementById(
        'estado'
      );


    estado.className =
      'estado estado-offline';


    estado.innerHTML =

      '🟡 ' +

      '<span class="estado-titulo">' +

      'SALIDA PENDIENTE' +

      '</span>' +

      '<br><br>' +

      'Entrada: ' +

      formatearHora(
        trabajo.timestamp
      ) +

      '<br>' +

      'Salida: ' +

      formatearHora(
        ahora
      ) +

      '<br><br>' +

      'Se sincronizará cuando vuelva Internet.';


    document
      .getElementById(
        'cliente'
      )
      .value =
      '';


    document
      .getElementById(
        'cliente'
      )
      .disabled =
      false;


    document
      .getElementById(
        'btnEntrada'
      )
      .disabled =
      true;


    actualizarIndicadorPendientes();


    return;

  }


  /*
   * =================================================
   * CON INTERNET
   * =================================================
   */

  mostrarMensajeApp(
    'Registrando salida...',
    false,
    true
  );


  try {

    const resultado =
      await llamarAPI(
        'registrarSalida',
        {

          email:
            emailActual

        }
      );


    if (!resultado.ok) {

      mostrarMensajeApp(
        resultado.mensaje,
        true
      );


      boton.disabled =
        false;


      await actualizarEstado();


      return;

    }


    let textoHoras;


    if (
      resultado.horasTexto
    ) {

      textoHoras =
        resultado.horasTexto;

    }

    else if (
      resultado.horas !== undefined &&
      resultado.horas !== null &&
      !isNaN(
        Number(resultado.horas)
      )
    ) {

      textoHoras =
        convertirHoras(
          Number(resultado.horas)
        );

    }

    else if (
      resultado.entrada &&
      resultado.salida
    ) {

      const horas =
        (
          Number(resultado.salida) -
          Number(resultado.entrada)
        ) /
        1000 /
        60 /
        60;


      textoHoras =
        convertirHoras(
          horas
        );

    }

    else {

      textoHoras =
        '0 minutos';

    }


    mostrarMensajeApp(

      '✓ Salida registrada. ' +

      'Trabajaste ' +

      textoHoras +

      '.',

      false

    );


    document
      .getElementById(
        'cliente'
      )
      .value =
      '';


    await actualizarEstado();

  }

  catch (error) {

    if (
      error.message ===
      'SIN_CONEXION'
    ) {

      const trabajo =
        obtenerTrabajoOffline();


      /*
       * Si la entrada había sido
       * registrada online pero
       * perdimos conexión antes
       * de registrar la salida,
       * necesitamos guardar la
       * salida pendiente.
       */

      if (
        trabajo
      ) {

        const ahora =
          Date.now();


        agregarOperacionOffline({

          tipo:
            'salida',

          email:
            emailActual,

          timestamp:
            ahora

        });


        borrarTrabajoOffline();


        mostrarMensajeApp(
          '✓ Salida guardada. Se sincronizará cuando vuelva Internet.',
          false
        );


        mostrarEstadoSalidaPendiente(
          trabajo,
          ahora
        );

      }

      else {

        /*
         * Si no tenemos la entrada
         * local, no inventamos una.
         */

        mostrarMensajeApp(
          'Se perdió la conexión y no se pudo determinar la entrada.',
          true
        );


        boton.disabled =
          false;

      }


      actualizarIndicadorPendientes();

    }

    else {

      mostrarMensajeApp(
        'ERROR: ' +
        error.message,
        true
      );


      boton.disabled =
        false;

    }

  }

}

/* =====================================================
   COLA OFFLINE
   ===================================================== */

function obtenerColaOffline() {

  try {

    const datos =
      localStorage.getItem(
        STORAGE_COLA
      );


    if (!datos) {

      return [];

    }


    const cola =
      JSON.parse(datos);


    if (
      !Array.isArray(cola)
    ) {

      return [];

    }


    return cola;

  }

  catch (error) {

    return [];

  }

}


/* =====================================================
   GUARDAR OPERACIÓN OFFLINE
   ===================================================== */

function agregarOperacionOffline(
  operacion
) {

  const cola =
    obtenerColaOffline();


  operacion.id =
    Date.now() +
    '_' +
    Math.random()
      .toString(36)
      .substring(2);


  operacion.creada =
    Date.now();


  cola.push(
    operacion
  );


  localStorage.setItem(
    STORAGE_COLA,
    JSON.stringify(
      cola
    )
  );


  actualizarIndicadorPendientes();

}


/* =====================================================
   MOSTRAR PENDIENTES
   ===================================================== */

function actualizarIndicadorPendientes() {

  const pendientes =
    obtenerColaOffline();


  const elemento =
    document.getElementById(
      'sincronizacion'
    );


  const indicador =
    document.getElementById(
      'estadoConexion'
    );


  if (!elemento) {
    return;
  }


  if (
    pendientes.length === 0
  ) {

    elemento.classList.remove(
      'visible'
    );


    if (
      navigator.onLine
    ) {

      indicador.className =
        'estadoConexion online';


      indicador.innerText =
        '🟢 CONECTADO';

    }

    else {

      indicador.className =
        'estadoConexion offline';


      indicador.innerText =
        '🔴 SIN CONEXIÓN';

    }


    return;

  }


  elemento.classList.add(
    'visible'
  );


  elemento.innerText =

    '⏳ ' +

    pendientes.length +

    (
      pendientes.length === 1
        ? ' operación pendiente de sincronizar.'
        : ' operaciones pendientes de sincronizar.'
    );


  if (
    navigator.onLine
  ) {

    indicador.className =
      'estadoConexion pendiente';


    indicador.innerText =
      '🟡 PENDIENTES';

  }

  else {

    indicador.className =
      'estadoConexion offline';


    indicador.innerText =
      '🔴 SIN CONEXIÓN';

  }

}


/* =====================================================
   SINCRONIZAR PENDIENTES
   ===================================================== */

async function sincronizarPendientes() {

  if (
    sincronizando
  ) {

    return;

  }


  if (
    !navigator.onLine
  ) {

    return;

  }


  const cola =
    obtenerColaOffline();


  if (
    cola.length === 0
  ) {

    actualizarIndicadorPendientes();

    return;

  }


  sincronizando =
    true;


  try {

    /*
     * IMPORTANTE:
     *
     * Procesamos una operación
     * por vez.
     *
     * Así:
     *
     * ENTRADA
     * ↓
     * SALIDA
     *
     * nunca se invierten.
     */

    for (
      let i = 0;
      i < cola.length;
      i++
    ) {

      if (
        !navigator.onLine
      ) {

        break;

      }


      const operacion =
        cola[i];


      let resultado;


      try {

        /*
         * =================================================
         * ENTRADA
         * =================================================
         */

        if (
          operacion.tipo ===
          'entrada'
        ) {

          resultado =
            await llamarAPI(
              'registrarEntrada',
              {

                email:
                  operacion.email,

                cliente:
                  operacion.cliente,

                /*
                 * IMPORTANTE:
                 * WebApp.gs espera
                 * fechaEntrada.
                 */

                fechaEntrada:
                  operacion.timestamp

              }
            );

        }


        /*
         * =================================================
         * SALIDA
         * =================================================
         */

        else if (
          operacion.tipo ===
          'salida'
        ) {

          resultado =
            await llamarAPI(
              'registrarSalida',
              {

                email:
                  operacion.email,

                /*
                 * IMPORTANTE:
                 * WebApp.gs espera
                 * fechaSalida.
                 */

                fechaSalida:
                  operacion.timestamp

              }
            );

        }


        /*
         * Operación desconocida.
         */

        else {

          console.log(
            'Operación desconocida:',
            operacion
          );


          cola.splice(
            i,
            1
          );


          i--;


          localStorage.setItem(
            STORAGE_COLA,
            JSON.stringify(
              cola
            )
          );


          continue;

        }


        /*
         * =================================================
         * RESULTADO
         * =================================================
         */

        if (
          resultado &&
          resultado.ok
        ) {

          /*
           * Eliminamos la operación
           * sincronizada.
           */

          cola.splice(
            i,
            1
          );


          i--;


          localStorage.setItem(
            STORAGE_COLA,
            JSON.stringify(
              cola
            )
          );


          /*
           * Si sincronizamos una
           * entrada, conservamos
           * temporalmente el estado
           * hasta que llegue la salida.
           */

          if (
            operacion.tipo ===
            'entrada'
          ) {

            guardarTrabajoOffline({

              email:
                operacion.email,

              cliente:
                operacion.cliente,

              timestamp:
                operacion.timestamp

            });

          }


          /*
           * Si sincronizamos una
           * salida, ya no existe
           * trabajo pendiente.
           */

          if (
            operacion.tipo ===
            'salida'
          ) {

            borrarTrabajoOffline();

          }


          actualizarIndicadorPendientes();

        }

        else {

          /*
           * MUY IMPORTANTE:
           *
           * Si el servidor rechaza
           * una operación, NO la
           * borramos.
           */

          console.log(
            'Operación pendiente:',
            resultado
          );


          break;

        }

      }

      catch (error) {

        /*
         * Si se cae Internet,
         * dejamos todo intacto.
         */

        console.log(
          'Error sincronizando:',
          error
        );


        break;

      }

    }


    /*
     * Cuando terminó todo,
     * actualizamos el estado real.
     */

    if (
      navigator.onLine &&
      obtenerColaOffline().length === 0
    ) {

      mostrarMensajeApp(
        '✓ Operaciones sincronizadas correctamente.',
        false
      );


      /*
       * Si había una entrada y
       * luego una salida, el estado
       * real será consultado aquí.
       */

      await actualizarEstado();

    }

  }

  finally {

    sincronizando =
      false;


    actualizarIndicadorPendientes();

  }

}


/* =====================================================
   CAMBIAR USUARIO
   ===================================================== */

function cambiarUsuario() {

  /*
   * Si hay operaciones pendientes,
   * no conviene permitir cambiar
   * de usuario porque la cola debe
   * mantenerse asociada al usuario.
   */

  const pendientes =
    obtenerColaOffline()
      .filter(
        function(op) {

          return (
            op.email ===
            emailActual
          );

        }
      );


  if (
    pendientes.length > 0
  ) {

    alert(
      'No podés cambiar de usuario mientras haya operaciones pendientes de sincronización. Conectate a Internet y esperá a que se sincronicen.'
    );


    return;

  }


  if (
    !confirm(
      '¿Querés cambiar de usuario en este teléfono?'
    )
  ) {

    return;

  }


  localStorage.removeItem(
    STORAGE_EMAIL
  );


  localStorage.removeItem(
    STORAGE_NOMBRE
  );


  emailActual =
    '';


  nombreActual =
    '';


  clientesActuales =
    [];


  document
    .getElementById(
      'pantallaApp'
    )
    .classList
    .add('oculto');


  document
    .getElementById(
      'pantallaLogin'
    )
    .classList
    .remove('oculto');


  document
    .getElementById(
      'email'
    )
    .value =
    '';


  document
    .getElementById(
      'email'
    )
    .focus();


  actualizarIndicadorConexion();

}


/* =====================================================
   HORA
   ===================================================== */

function formatearHora(
  timestamp
) {

  const fecha =
    new Date(
      timestamp
    );


  return fecha.toLocaleTimeString(
    'es-AR',
    {

      hour:
        '2-digit',

      minute:
        '2-digit',

      second:
        '2-digit'

    }
  );

}


/* =====================================================
   HORAS TRABAJADAS
   ===================================================== */

function convertirHoras(
  horas
) {

  let h =
    Math.floor(
      horas
    );


  let minutos =
    Math.round(
      (horas - h) * 60
    );


  if (
    minutos >= 60
  ) {

    h++;
    minutos = 0;

  }


  if (
    h === 0
  ) {

    return
      minutos +
      ' minutos';

  }


  return
    h +
    (
      h === 1
        ? ' hora'
        : ' horas'
    ) +
    (
      minutos > 0
        ? ' ' +
          minutos +
          (
            minutos === 1
              ? ' minuto'
              : ' minutos'
          )
        : ''
    );

}


/* =====================================================
   MENSAJE LOGIN
   ===================================================== */

function mostrarMensajeLogin(
  texto,
  error,
  cargando
) {

  const elemento =
    document.getElementById(
      'mensajeLogin'
    );


  elemento.innerText =
    texto;


  if (
    error
  ) {

    elemento.className =
      'mensaje mensaje-error';

  }

  else if (
    cargando
  ) {

    elemento.className =
      'mensaje mensaje-cargando';

  }

  else {

    elemento.className =
      'mensaje mensaje-ok';

  }

}


/* =====================================================
   MENSAJE APP
   ===================================================== */

function mostrarMensajeApp(
  texto,
  error,
  cargando,
  offline
) {

  const elemento =
    document.getElementById(
      'mensajeApp'
    );


  elemento.innerText =
    texto;


  if (
    error
  ) {

    elemento.className =
      'mensaje mensaje-error';

  }

  else if (
    offline
  ) {

    elemento.className =
      'mensaje mensaje-offline';

  }

  else if (
    cargando
  ) {

    elemento.className =
      'mensaje mensaje-cargando';

  }

  else {

    elemento.className =
      'mensaje mensaje-ok';

  }

}


/* =====================================================
   VISIBILITY CHANGE
   ===================================================== */

document.addEventListener(
  'visibilitychange',
  function() {

    if (
      document.visibilityState ===
      'visible'
    ) {

      actualizarIndicadorConexion();


      /*
       * Primero recuperamos
       * clientes locales.
       */

      if (
        emailActual
      ) {

        cargarClientesLocales();

      }


      if (
        navigator.onLine
      ) {

        sincronizarPendientes();

        if (
          emailActual
        ) {

          cargarClientes();

          actualizarEstado();

        }

      }

      else {

        actualizarEstadoOffline();

      }

    }

  }
);


/* =====================================================
   SINCRONIZACIÓN PERIÓDICA
   ===================================================== */

setInterval(
  function() {

    if (
      navigator.onLine
    ) {

      sincronizarPendientes();

    }

  },
  15000
);

</script>
